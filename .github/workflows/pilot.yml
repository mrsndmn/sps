name: pilot
on: [push, pull_request]
jobs:
  orchestration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install pytest requests
      - run: python -m pytest -q tests/test_pilot.py
      - run: python run_train_jobs.py --dry
      - run: python run_train_jobs.py --dry --phase prepare
      - run: python run_eval.py --dry
      - run: SPS_EXPERIMENT_SUITE=10b python run_train_jobs.py --dry --phase prepare
      - run: SPS_EXPERIMENT_SUITE=10b python run_train_jobs.py --dry
      - run: SPS_EXPERIMENT_SUITE=10b python run_eval.py --dry
      - run: SPS_EXPERIMENT_SUITE=mtp python run_train_jobs.py --dry --phase prepare
      - run: SPS_EXPERIMENT_SUITE=mtp python run_train_jobs.py --dry
      - run: SPS_EXPERIMENT_SUITE=mtp python run_eval.py --dry
      - run: SPS_EXPERIMENT_SUITE=mtp-unfreeze python run_train_jobs.py --dry --phase prepare
      - run: SPS_EXPERIMENT_SUITE=mtp-unfreeze python run_train_jobs.py --dry
      - run: SPS_EXPERIMENT_SUITE=mtp-unfreeze python run_eval.py --dry
      - run: SPS_EXPERIMENT_SUITE=mtp-parallel python run_eval.py --dry
      - run: python -m compileall -q scripts experiments.py run_train_jobs.py run_eval.py
  mtp-cpu:
    runs-on: ubuntu-latest
    env:
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install pytest numpy requests
      - run: pip install torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu
      - run: PYTHONPATH=.:src python -m pytest -q tests/test_mtp_jobs.py tests/test_mtp_speculative.py tests/test_mtp_unfreeze_jobs.py tests/test_mtp_unfreeze_loading.py tests/test_mtp_parallel.py
