name: pilot
on: [push, pull_request]
jobs:
  orchestration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install pytest
      - run: python -m pytest -q tests/test_pilot.py
      - run: python run_train_jobs.py --dry
      - run: python run_train_jobs.py --dry --phase prepare
      - run: python run_eval.py --dry
      - run: python -m compileall -q scripts experiments.py run_train_jobs.py run_eval.py
