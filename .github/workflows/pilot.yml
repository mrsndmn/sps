name: pilot
on: [push, pull_request]
env:
  PYTHONPATH: src
jobs:
  orchestration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install pytest requests
      - run: python -m pytest -q tests/test_script_layout.py tests/test_pilot.py tests/test_ar_sps_jobs.py tests/test_instruct_jobs.py tests/test_ifeval_jobs.py tests/test_sched_jobs.py tests/test_base50.py tests/test_extend_jobs.py tests/test_vllm_sps_jobs.py tests/test_serving_runtime.py tests/test_serving_benchmark.py tests/test_serving_graphs.py
      - run: python scripts/serving/vllm_sps_run.py --phase probe --dry
      - run: python scripts/serving/vllm_sps_run.py --phase train --dry
      - run: python scripts/serving/serving_runtime.py --dry
      - run: python scripts/serving/serving_benchmark.py --phase audit --dry
      - run: python scripts/serving/serving_benchmark.py --phase eval --dry
      - run: python scripts/serving/serving_graphs.py --phase audit --dry
      - run: python scripts/serving/serving_graphs.py --phase eval --dry
      - run: python scripts/run_train_jobs.py --dry
      - run: python scripts/run_train_jobs.py --dry --phase prepare
      - run: python scripts/run_eval.py --dry
      - run: SPS_EXPERIMENT_SUITE=10b python scripts/run_train_jobs.py --dry --phase prepare
      - run: SPS_EXPERIMENT_SUITE=10b python scripts/run_train_jobs.py --dry
      - run: SPS_EXPERIMENT_SUITE=10b python scripts/run_eval.py --dry
      - run: SPS_EXPERIMENT_SUITE=mtp python scripts/run_train_jobs.py --dry --phase prepare
      - run: SPS_EXPERIMENT_SUITE=mtp python scripts/run_train_jobs.py --dry
      - run: SPS_EXPERIMENT_SUITE=mtp python scripts/run_eval.py --dry
      - run: SPS_EXPERIMENT_SUITE=mtp-unfreeze python scripts/run_train_jobs.py --dry --phase prepare
      - run: SPS_EXPERIMENT_SUITE=mtp-unfreeze python scripts/run_train_jobs.py --dry
      - run: SPS_EXPERIMENT_SUITE=mtp-unfreeze python scripts/run_eval.py --dry
      - run: SPS_EXPERIMENT_SUITE=mtp-parallel python scripts/run_eval.py --dry
      - run: SPS_EXPERIMENT_SUITE=mtp-unified python scripts/run_eval.py --dry
      - run: SPS_EXPERIMENT_SUITE=spec-baselines python scripts/run_train_jobs.py --phase prepare --dry
      - run: SPS_EXPERIMENT_SUITE=spec-baselines python scripts/run_train_jobs.py --dry
      - run: SPS_EXPERIMENT_SUITE=spec-baselines python scripts/run_eval.py --dry
      - run: python -m compileall -q scripts src
  mtp-cpu:
    runs-on: ubuntu-latest
    env:
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install pytest numpy requests transformers==4.57.1 "datasets<=3.6.0"
      - run: pip install torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pytest -q tests/test_named_experiments.py tests/test_mtp_jobs.py tests/test_mtp_speculative.py tests/test_mtp_unfreeze_jobs.py tests/test_mtp_unfreeze_loading.py tests/test_mtp_parallel.py tests/test_spec_baselines.py tests/test_mtp_unified.py

      - run: python -m pytest -q tests/test_ar_sps.py tests/test_ar_sps_distillation.py tests/test_mmlu_stem.py tests/test_mmlu_generation.py tests/test_instruct_eval.py tests/test_instruct_train.py tests/test_instruct_data.py tests/test_ifeval_worker.py tests/test_sched_eval.py tests/test_base50_finalize.py tests/test_extend_train.py tests/test_qwen_sps_mtp.py
