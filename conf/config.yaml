# Main configuration file
defaults:
  - training: default
  - optimizer: adamw
  - scheduler: linear_decay
  - model: standard
  - data: fineweb-edu
  - logging: default
  - system: default
  - eval: default
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: disabled
  - _self_

# Hydra creates this directory even with job logging disabled.
hydra:
  run:
    dir: ${oc.env:SPS_OUTPUT_ROOT,/mnt/virtual_ai0001053-00054_SR004-nfs2/d.tarasov/sps-artifacts/outputs}/${now:%Y-%m-%d}/${hydra.job.name}-${now:%H-%M-%S-%f}
  sweep:
    dir: ${oc.env:SPS_OUTPUT_ROOT,/mnt/virtual_ai0001053-00054_SR004-nfs2/d.tarasov/sps-artifacts/outputs}/multirun/${now:%Y-%m-%d}/${hydra.job.name}-${now:%H-%M-%S-%f}
